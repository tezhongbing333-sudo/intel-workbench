<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" id="metaTheme" />
<title>AI 情报工作台</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1b1d22; --sub:#5f6369; --line:#e6e8ec;
    --accent:#0f8f73; --accent-soft:#e3f3ee;
    --c-pol:#e24b4a; --c-mil:#d85a30; --c-eco:#5a9e2f; --c-tec:#2f7fd6; --c-soc:#c08a1e; --c-ent:#cf4f86;
    --c-fin:#7c5cff; --c-ai:#0fb5c9; --c-baby:#e84393;
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --card:#171a21; --text:#e8eaed; --sub:#9aa0a8; --line:#262b33;
    --accent:#39c2a0; --accent-soft:#10302a;
    --c-pol:#f06a68; --c-mil:#ef8a5a; --c-eco:#86c95a; --c-tec:#5fa8f0; --c-soc:#e0ad4a; --c-ent:#ec7aa8;
    --c-fin:#9b7bff; --c-ai:#3fd0e0; --c-baby:#f56fae;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:780px;margin:0 auto;padding:14px 14px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .logo svg{width:22px;height:22px;color:var(--accent)}
  h1{font-size:18px;margin:0;font-weight:600}
  .sub{font-size:12px;color:var(--sub);margin-top:1px}
  .tools{display:flex;gap:8px;flex:0 0 auto}
  .tbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .tbtn:active{transform:scale(.95)}
  .tbtn svg{width:20px;height:20px}
  .banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:11px 13px;font-size:13px;margin:10px 0 0;display:none}
  .banner.show{display:block}
  .banner b{color:var(--accent)}
  .meta{font-size:12px;color:var(--sub);margin:12px 0 12px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .meta span{display:inline-flex;align-items:center;gap:4px}
  .meta svg{width:13px;height:13px;opacity:.7}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
  .kpi .n{font-size:23px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11px;color:var(--sub);margin-top:5px}
  .kpi.hot .n{color:var(--c-pol)} .kpi.rel .n{color:var(--accent)} .kpi.new .n{color:var(--c-fin)}
  .focus{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--accent);border-radius:16px;padding:12px 13px;margin-bottom:14px}
  .focus .fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .focus .fh .t{font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
  .focus .fh .t svg{width:16px;height:16px}
  .focus .fh .cl{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer}
  .fitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .fitem:last-child{margin-bottom:0}
  .fitem .ft{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .fitem h4{font-size:14px;margin:0;font-weight:600;line-height:1.4}
  .fitem .fd{font-size:12.5px;color:var(--text);background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:7px 9px;margin-top:2px}
  .fitem .fd b{color:var(--accent)}
  .fitem .fs{font-size:11px;color:var(--sub);margin-top:5px}
  .search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:11px}
  .search::placeholder{color:var(--sub)}
  .chips{display:none;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:38px}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .chip .cnt{font-size:11px;background:var(--line);color:var(--sub);border-radius:999px;padding:0 6px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .chip.on .cnt{background:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:218px 1fr;gap:20px;align-items:start}
  .side{position:sticky;top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
  .side .sT{font-size:12px;color:var(--sub);padding:4px 8px 9px;font-weight:600}
  .side .nav{display:flex;flex-direction:column;gap:3px}
  .side .navbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 10px;border-radius:10px;font-size:13.5px;cursor:pointer;min-height:42px}
  .side .navbtn:hover{background:var(--accent-soft)}
  .side .navbtn.on{background:var(--accent);color:#fff}
  .side .navbtn .c{font-size:11px;background:var(--bg);color:var(--sub);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .side .navbtn.on .c{background:rgba(255,255,255,.25);color:#fff}
  .pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .pager .pg{min-height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:13.5px}
  .pager .pg.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pager .pg:disabled{opacity:.4;cursor:default}
  .pager .dots{padding:0 5px;color:var(--sub)}
  @media(max-width:760px){ .grid{display:block} .side{display:none} .chips{display:flex} }
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:11px;position:relative}
  .item.read{opacity:.5}
  .item .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 9px;border-radius:999px;color:#fff}
  .time{font-size:12px;color:var(--sub)}
  .rel{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;margin-left:auto}
  .imp{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .ovs{font-size:11px;color:#fff;background:#d97706;border-radius:999px;padding:1px 8px}
  .kw{font-size:11px;color:var(--c-baby);border:1px solid var(--c-baby);border-radius:999px;padding:1px 8px}
  .item h3{font-size:15.5px;margin:0 0 6px;font-weight:600;line-height:1.45}
  .item p{margin:0 0 9px;color:var(--sub);font-size:13.5px}
  .decision{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:9px 11px;font-size:13px;color:var(--text)}
  .decision b{color:var(--accent)}
  .src{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--sub);gap:8px}
  .src a{color:var(--accent);text-decoration:none}
  .actions{display:flex;gap:8px;margin-top:10px}
  .act{flex:1;height:40px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;cursor:pointer}
  .act svg{width:16px;height:16px}
  .act.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  .morebar{display:flex;gap:9px;margin-bottom:11px}
  .more{flex:1;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 8px;font-size:14px;cursor:pointer;min-height:46px}
  .more.alt{flex:0 0 42%;background:var(--card);border-color:var(--line);color:var(--sub)}
  .more:active{transform:scale(.98)}
  footer{font-size:12px;color:var(--sub);margin-top:18px;text-align:center;line-height:1.8}
  .sentinel{height:1px}
  /* 设置抽屉 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,90vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:50;padding:18px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
  .drawer.show{transform:translateX(0)}
  .drawer h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;justify-content:space-between}
  .drawer h2 button{background:none;border:none;color:var(--sub);cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .drawer h2 button svg{width:20px;height:20px}
  .drawer .desc{font-size:12px;color:var(--sub);margin:0 0 16px}
  .field{margin-bottom:18px}
  .field label{font-size:13px;font-weight:600;display:block;margin-bottom:7px}
  .field textarea,.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit}
  .field textarea{height:90px;resize:vertical}
  .field .hint{font-size:11px;color:var(--sub);margin-top:5px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .row span{font-size:14px}
  .switch{position:relative;width:46px;height:26px;flex:0 0 auto}
  .switch input{display:none}
  .switch i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;display:block}
  .switch i:before{content:"";position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + i{background:var(--accent)}
  .switch input:checked + i:before{transform:translateX(20px)}
  .btn{width:100%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:12px;font-size:14px;cursor:pointer;margin-bottom:10px;min-height:46px}
  .btn.sec{border-color:var(--line);background:var(--card);color:var(--text)}
  .btn:active{transform:scale(.98)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:520px){ .kpis{grid-template-columns:repeat(2,1fr)} h1{font-size:16px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 512 512"><circle cx="256" cy="256" r="150" fill="none" stroke="currentColor" stroke-width="22"/><path d="M176 256 L236 316 L352 196" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><h1>AI 情报工作台</h1><div class="sub">知天下事 · 辅助你的个人决策</div></div>
    </div>
    <div class="tools">
      <button class="tbtn" id="theme" aria-label="切换主题"></button>
      <button class="tbtn" id="settings" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="meta" id="meta"></div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <aside class="side"><div class="sT">浏览方式</div><div class="nav" id="sideNav"></div></aside>
    <main class="main">

  <section class="focus" id="focusSec">
    <div class="fh">
      <span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.4 2.3 7.2L12 17l-6.3 4 2.3-7.2-6-4.4h7.6z" stroke-linejoin="round"/></svg>今日决策速览</span>
      <button class="cl" id="focusToggle">收起</button>
    </div>
    <div id="focusList"></div>
  </section>

  <input class="search" id="search" placeholder="搜索关键词，如：联通 / 育儿 / 利率 / 消金" />

  <div class="chips" id="chips"></div>

  <div id="list"></div>

  <footer id="footer"></footer>
    </main>
  </div>

<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <h2>设置 <button id="closeDrawer" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></h2>
  <p class="desc">关注词决定"我的关注"里浮上来哪些事；线索、已读、关注词都只存在本机浏览器。</p>

  <div class="field">
    <label>我的关注词</label>
    <textarea id="kwInput" placeholder="用空格、逗号或换行分隔，如：联通 招联 育儿 利率 汇率 房价 医保 母婴 消费 广告"></textarea>
    <div class="hint">命中标题/摘要/决策提示的条目，会自动排到「我的关注」最前。</div>
    <button class="btn" id="saveKw" style="margin-top:10px">保存关注词</button>
  </div>

  <div class="row">
    <span>隐藏已读条目</span>
    <label class="switch"><input type="checkbox" id="hideRead"><i></i></label>
  </div>

  <div class="field" style="margin-top:18px">
    <label>数据备份</label>
    <button class="btn" id="exportSet">导出设置与线索（JSON）</button>
    <button class="btn sec" id="importSet">导入设置与线索</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <div class="hint">换手机/清缓存前导出一份，可完整恢复关注词、线索与已读。</div>
  </div>

  <div class="field">
    <label>清空本机数据</label>
    <button class="btn sec" id="clearAll">清空已读 / 线索（保留关注词）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var CATS = ["金融","AI行业","母婴","政治/政策","军事/地缘","经济","科技","社会/生活","娱乐/文娱"];
  var FAMILY = ["母婴","金融"];
  var COLORS = {
    "政治/政策":"--c-pol","军事/地缘":"--c-mil","经济":"--c-eco","科技":"--c-tec",
    "社会/生活":"--c-soc","娱乐/文娱":"--c-ent","金融":"--c-fin","AI行业":"--c-ai","母婴":"--c-baby"
  };
  var ICON = {
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>',
    news:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h13v14H4z"/><path d="M17 8h3v11h-3"/><line x1="7" y1="8" x2="14" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/></svg>',
    globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 3 14.6 9 21 9.6 16 14 17.5 20.5 12 17 6.5 20.5 8 14 3 9.6 9.4 9"/></svg>',
    starF:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><polygon points="12 3 14.6 9 21 9.6 16 14 17.5 20.5 12 17 6.5 20.5 8 14 3 9.6 9.4 9"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>',
    checkF:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  var B = window.BRIEFING || {date:"",items:[]};
  var items = B.items || [];
  var filter = "全部";
  var query = "";
  var focusOpen = true;
  var CHUNK = 14;
  var rendered = 0;
  var matched = [];

  // ---------- 设置 ----------
  var SK = "intel-settings-v1";
  var settings = { keywords:[], read:[], clues:[], hideRead:false };
  try { var s = JSON.parse(localStorage.getItem(SK)); if(s && typeof s==="object"){ settings = Object.assign(settings, s); } } catch(e){}
  if(!Array.isArray(settings.keywords)) settings.keywords=[];
  if(!Array.isArray(settings.read)) settings.read=[];
  if(!Array.isArray(settings.clues)) settings.clues=[];
  function saveSettings(){ localStorage.setItem(SK, JSON.stringify(settings)); }

  var readSet = {}; settings.read.forEach(function(id){ readSet[id]=1; });
  var clueSet = {}; settings.clues.forEach(function(id){ clueSet[id]=1; });

  function kwNorm(k){ return String(k||"").trim().toLowerCase(); }
  function hay(it){ return (it.title+" "+it.summary+" "+it.decision+" "+it.source+" "+it.cat).toLowerCase(); }
  function focusOf(it){
    if(!settings.keywords.length) return false;
    var h = hay(it);
    return settings.keywords.some(function(k){ var t=kwNorm(k); return t && h.indexOf(t)>-1; });
  }
  function isFamily(it){ return FAMILY.indexOf(it.cat)>-1; }
  function isClue(it){ return !!clueSet[it.id]; }
  function isRead(it){ return !!readSet[it.id]; }

  var html = document.documentElement;
  function applyTheme(d){
    html.setAttribute("data-theme", d);
    document.getElementById("theme").innerHTML = d==="dark"?ICON.sun:ICON.moon;
    var mt = document.getElementById("metaTheme"); if(mt) mt.setAttribute("content", d==="dark"?"#0f1115":"#f6f7f9");
  }
  var savedTheme = localStorage.getItem("intel-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
  applyTheme(savedTheme);
  document.getElementById("theme").onclick = function(){
    savedTheme = savedTheme==="dark"?"light":"dark";
    localStorage.setItem("intel-theme", savedTheme);
    applyTheme(savedTheme);
  };

  // ---------- 元信息 + KPI ----------
  function metaIcon(ic){ return ic; }
  document.getElementById("meta").innerHTML =
    metaIcon(ICON.cal)+"<span>"+B.date+"</span>"+
    metaIcon(ICON.news)+"<span>"+B.edition+"</span>"+
    metaIcon(ICON.globe)+"<span>"+(B.scope||"")+"</span>"+
    metaIcon(ICON.clock)+"<span>生成 "+B.generatedAt+"</span>";

  var total = items.length;
  var high = items.filter(function(it){return it.impact==="high";}).length;
  var related = items.filter(function(it){return it.related;}).length;
  var todayNew = (B.kpi && typeof B.kpi.todayNew==="number") ? B.kpi.todayNew : 0;
  document.getElementById("kpis").innerHTML =
    '<div class="kpi"><div class="n">'+total+'</div><div class="l">情报池总量</div></div>'+
    '<div class="kpi hot"><div class="n">'+high+'</div><div class="l">高影响事件</div></div>'+
    '<div class="kpi rel"><div class="n">'+related+'</div><div class="l">与你相关</div></div>'+
    '<div class="kpi new"><div class="n">'+todayNew+'</div><div class="l">今日新增</div></div>';

  // ---------- 今日决策速览 ----------
  function score(it){
    var s = 0;
    if(focusOf(it)) s += 1000;
    if(it.related) s += 500;
    if(it.firstSeen === B.date) s += 300;
    if(it.impact==="high") s += 200; else if(it.impact==="mid") s += 100;
    if(isClue(it)) s += 50;
    return s;
  }
  function renderFocus(){
    var top = items.slice().sort(function(a,b){ return score(b)-score(a); }).slice(0,5);
    var box = document.getElementById("focusList");
    box.innerHTML = top.map(function(it){
      var col = colorVar(it.cat);
      var imp = it.impact==="high"?"高影响":(it.impact==="mid"?"中":"低");
      return '<div class="fitem">'+
        '<div class="ft"><span class="tag" style="background:'+col+'">'+it.cat+'</span>'+
        (it.overseas?'<span class="ovs">海外</span>':'')+
        '<span class="imp">'+imp+'</span>'+
        (it.related?'<span class="rel">★ 相关</span>':'')+'</div>'+
        '<h4>'+it.title+'</h4>'+
        '<div class="fd"><b>决策提示：</b>'+it.decision+'</div>'+
        '<div class="fs">来源：'+it.source+' · <a href="'+it.url+'" target="_blank" rel="noopener" style="color:var(--accent)">查看原文 ↗</a></div>'+
      '</div>';
    }).join("");
  }
  document.getElementById("focusToggle").onclick = function(){
    focusOpen = !focusOpen;
    document.getElementById("focusList").style.display = focusOpen?"":"none";
    this.textContent = focusOpen?"收起":"展开";
  };

  // ---------- 筛选 ----------
  function colorVar(cat){ return getComputedStyle(html).getPropertyValue(COLORS[cat]||"--accent").trim(); }
  function catCount(c){
    if(c==="全部") return items.length;
    if(c==="我的关注") return items.filter(focusOf).length;
    if(c==="家庭") return items.filter(isFamily).length;
    if(c==="线索") return settings.clues.length;
    return items.filter(function(it){return it.cat===c;}).length;
  }
  function computeMatched(){
    return items.filter(function(it){
      if(filter==="我的关注"){ if(!focusOf(it)) return false; }
      else if(filter==="家庭"){ if(!isFamily(it)) return false; }
      else if(filter==="线索"){ if(!isClue(it)) return false; }
      else if(filter!=="全部"){ if(it.cat!==filter) return false; }
      if(settings.hideRead && isRead(it)) return false;
      if(query){ if(hay(it).indexOf(query)===-1) return false; }
      return true;
    });
  }
  function sortMatched(arr){
    if(settings.keywords.length && (filter==="全部"||filter==="我的关注")){
      arr.sort(function(a,b){ var fa=focusOf(a)?1:0, fb=focusOf(b)?1:0; if(fa!==fb) return fb-fa; return b.firstSeen.localeCompare(a.firstSeen); });
    }
    return arr;
  }

  var chips = document.getElementById("chips");
  var sideNav = document.getElementById("sideNav");
  var VIEWS = ["全部","我的关注","家庭","线索"].concat(CATS);
  function setFilter(c){
    filter = c; PAGE = 1; showAll = false;
    document.querySelectorAll(".chip,.navbtn").forEach(function(x){ x.classList.toggle("on", x.dataset.c===c); });
    render();
  }
  VIEWS.forEach(function(c){
    var ch = document.createElement("div");
    ch.className = "chip"+(c===filter?" on":""); ch.dataset.c = c;
    ch.innerHTML = c + '<span class="cnt">' + catCount(c) + '</span>';
    ch.onclick = function(){ setFilter(c); };
    chips.appendChild(ch);
    var nb = document.createElement("button");
    nb.className = "navbtn"+(c===filter?" on":""); nb.dataset.c = c; nb.type = "button";
    nb.innerHTML = '<span>'+c+'</span><span class="c">'+catCount(c)+'</span>';
    nb.onclick = function(){ setFilter(c); };
    sideNav.appendChild(nb);
  });
  document.getElementById("search").addEventListener("input", function(e){ query = e.target.value.trim().toLowerCase(); render(); });

  // ---------- 列表渲染（分页） ----------
  var listEl = document.getElementById("list");
  var PAGE = 1, PER = 20, showAll = false;

  function cardEl(it){
    var col = colorVar(it.cat);
    var imp = it.impact==="high"?"高影响":(it.impact==="mid"?"中":"低");
    var el = document.createElement("div");
    el.className = "item"+(isRead(it)?" read":"");
    var hitKw = "";
    if(settings.keywords.length){ var h=hay(it); settings.keywords.forEach(function(k){ var t=kwNorm(k); if(t && h.indexOf(t)>-1){ hitKw='<span class="kw">'+k.trim()+'</span>'; } }); }
    el.innerHTML =
      '<div class="top">'+
        '<span class="tag" style="background:'+col+'">'+it.cat+'</span>'+
        (it.overseas?'<span class="ovs">海外</span>':'')+
        '<span class="time">'+it.time+'</span>'+
        (hitKw?hitKw:'')+
        '<span class="imp">'+imp+'</span>'+
        (it.related?'<span class="rel">★ 相关</span>':'')+
      '</div>'+
      '<h3>'+it.title+'</h3>'+
      '<p>'+it.summary+'</p>'+
      '<div class="decision"><b>决策提示：</b>'+it.decision+'</div>'+
      '<div class="src"><span>来源：'+it.source+'</span><a href="'+it.url+'" target="_blank" rel="noopener">查看原文 ↗</a></div>'+
      '<div class="actions">'+
        '<button class="act'+(isClue(it)?" on":"")+'" data-act="clue">'+(isClue(it)?ICON.starF:ICON.star)+'<span>'+(isClue(it)?"已入线索":"加线索")+'</span></button>'+
        '<button class="act'+(isRead(it)?" on":"")+'" data-act="read">'+(isRead(it)?ICON.checkF:ICON.check)+'<span>'+(isRead(it)?"已读":"标记已读")+'</span></button>'+
      '</div>';
    el.querySelector('[data-act="clue"]').onclick = function(){
      if(clueSet[it.id]){ delete clueSet[it.id]; settings.clues = settings.clues.filter(function(x){return x!==it.id;}); }
      else { clueSet[it.id]=1; settings.clues.push(it.id); }
      saveSettings(); render();
    };
    el.querySelector('[data-act="read"]').onclick = function(){
      if(readSet[it.id]){ delete readSet[it.id]; settings.read = settings.read.filter(function(x){return x!==it.id;}); }
      else { readSet[it.id]=1; settings.read.push(it.id); }
      saveSettings(); render();
    };
    return el;
  }

  function pageNums(p, tot){
    var arr = [], i;
    if(tot <= 7){ for(i=1;i<=tot;i++) arr.push(i); }
    else {
      arr.push(1);
      if(p > 3) arr.push("…");
      var s = Math.max(2, p-1), e = Math.min(tot-1, p+1);
      for(i=s;i<=e;i++) arr.push(i);
      if(p < tot-2) arr.push("…");
      arr.push(tot);
    }
    return arr.map(function(n){
      if(n === "…") return '<span class="dots">…</span>';
      return '<button class="pg num'+(n===p?" cur":"")+'" data-p="'+n+'">'+n+'</button>';
    }).join("");
  }
  function renderPager(){
    var tot = Math.ceil(matched.length / PER) || 1;
    if(matched.length <= PER) return;
    var bar = document.createElement("div");
    bar.className = "pager";
    bar.innerHTML = '<button class="pg" id="prev"'+(PAGE<=1?" disabled":"")+'>‹ 上一页</button>'+
      '<span class="pgnums">'+pageNums(PAGE, tot)+'</span>'+
      '<button class="pg" id="next"'+(PAGE>=tot?" disabled":"")+'>下一页 ›</button>';
    listEl.appendChild(bar);
    if(PAGE > 1) document.getElementById("prev").onclick = function(){ PAGE--; renderList(); };
    if(PAGE < tot) document.getElementById("next").onclick = function(){ PAGE++; renderList(); };
    Array.prototype.forEach.call(bar.querySelectorAll(".pg.num"), function(b){
      b.onclick = function(){ PAGE = +b.dataset.p; renderList(); };
    });
  }
  function renderList(){
    listEl.innerHTML = "";
    if(!matched.length){ listEl.innerHTML = '<div class="empty">没有匹配的内容</div>'; return; }
    var items = showAll ? matched : matched.slice((PAGE-1)*PER, PAGE*PER);
    var frag = document.createDocumentFragment();
    items.forEach(function(it){ frag.appendChild(cardEl(it)); });
    listEl.appendChild(frag);
    if(showAll){
      var back = document.createElement("div");
      back.className = "morebar";
      back.innerHTML = '<button class="more alt" id="pgBack">↥ 收起，恢复分页</button>';
      listEl.appendChild(back);
      document.getElementById("pgBack").onclick = function(){ showAll = false; renderList(); };
    } else {
      renderPager();
    }
  }

  function render(){
    matched = sortMatched(computeMatched());
    PAGE = 1; showAll = false;
    renderList();
    renderFocus();
  }
  render();

  document.getElementById("footer").innerHTML = "AI 情报工作台 · 自动每日更新（早 07:00 / 晚 19:00）<br>可“添加到主屏幕”当作 App 使用 · 内容由公开网络检索聚合，仅供参考";

  // ---------- 安装提示 ----------
  var deferred=null, banner=document.getElementById("banner");
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred=e;
    banner.className="banner show";
    banner.innerHTML='可把这页<b>“添加到主屏幕”</b>当 App 用：手机浏览器菜单 → 添加到主屏幕。点此也可安装。<button class="btn" id="install" style="margin-left:8px;min-height:34px;padding:6px 12px">立即安装</button>';
    document.getElementById("install").onclick=function(){ deferred&&deferred.prompt(); };
  });
  if(!window.matchMedia || (!window.matchMedia("(display-mode: standalone)").matches && !deferred)){
    banner.className="banner show";
    banner.innerHTML='手机上使用：浏览器打开后，点菜单 → <b>“添加到主屏幕”</b>，即可像 App 一样随时打开。';
  }

  // ---------- 设置抽屉 ----------
  var drawer=document.getElementById("drawer"), mask=document.getElementById("mask");
  function openDrawer(){ drawer.classList.add("show"); mask.classList.add("show"); document.getElementById("kwInput").value = settings.keywords.join(" "); document.getElementById("hideRead").checked = settings.hideRead; }
  function closeDrawer(){ drawer.classList.remove("show"); mask.classList.remove("show"); }
  document.getElementById("settings").onclick = openDrawer;
  document.getElementById("closeDrawer").onclick = closeDrawer;
  mask.onclick = closeDrawer;
  document.getElementById("saveKw").onclick = function(){
    var v = document.getElementById("kwInput").value.split(/[\s,，、]+/).map(function(x){return x.trim();}).filter(Boolean);
    settings.keywords = v; saveSettings(); toast("已保存 "+v.length+" 个关注词"); rebuildChips(); render();
  };
  document.getElementById("hideRead").onchange = function(){ settings.hideRead=this.checked; saveSettings(); render(); };
  document.getElementById("exportSet").onclick = function(){
    var blob = new Blob([JSON.stringify(settings,null,2)], {type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="intel-settings-"+B.date+".json"; a.click();
    toast("已导出设置");
  };
  document.getElementById("importSet").onclick = function(){ document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result); settings=Object.assign({keywords:[],read:[],clues:[],hideRead:false},d);
      readSet={}; settings.read.forEach(function(id){readSet[id]=1;}); clueSet={}; settings.clues.forEach(function(id){clueSet[id]=1;});
      saveSettings(); rebuildChips(); render(); toast("已导入设置"); closeDrawer();
    }catch(err){ toast("导入失败：文件格式不对"); } };
    r.readAsText(f); e.target.value="";
  };
  document.getElementById("clearAll").onclick = function(){
    if(!confirm("确定清空本机的已读记录和线索？（关注词会保留）")) return;
    settings.read=[]; settings.clues=[]; readSet={}; clueSet={}; saveSettings(); rebuildChips(); render(); toast("已清空");
  };

  function rebuildChips(){
    chips.innerHTML="";
    VIEWS.forEach(function(c){
      var el=document.createElement("div");
      el.className="chip"+(c===filter?" on":"");
      el.innerHTML=c+'<span class="cnt">'+catCount(c)+'</span>';
      el.onclick=function(){ filter=c; document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")}); el.classList.add("on"); render(); };
      chips.appendChild(el);
    });
  }

  // ---------- toast ----------
  var toastEl=document.getElementById("toast"), toastTimer;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove("show");},1800); }

  // ---------- Service Worker ----------
  if("serviceWorker" in navigator){
    var had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){ if(!had){had=true;return;} location.reload(); });
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
